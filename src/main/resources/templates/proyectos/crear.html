<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Añadir Proyecto</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1>Añadir Proyecto</h1>
    <form th:action="@{/proyectos}" th:object="${proyecto}" method="post">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" th:field="*{descripcion}"></textarea>
      </div>
      <div class="mb-3">
        <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
        <input type="date" class="form-control" id="fechaInicio" th:field="*{fechaInicio}" required>
      </div>
      <div class="mb-3">
        <label for="estado" class="form-label">Estado</label>
        <select class="form-select" id="estado" th:field="*{estado}" required>
          <option value="" disabled selected>Seleccione un estado</option>
          <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Guardar Proyecto</button>
    </form>
	<a class="btn btn-secondary mt-3" th:href="@{/proyectos}">Volver a Proyectos</a>
  </div>
</body>
</html>
