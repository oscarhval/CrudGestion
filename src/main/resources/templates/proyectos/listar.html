<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Listado de Proyectos</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1>Proyectos</h1>
    <a class="btn btn-primary mb-3" th:href="@{/proyectos/crear}">Crear Proyecto</a>
    <table class="table table-dark table-striped custom-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Fecha de Inicio</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="proyecto : ${proyectos}">
          <td th:text="${proyecto.id}"></td>
          <td th:text="${proyecto.nombre}"></td>
          <td th:text="${proyecto.fechaInicio}"></td>
          <td th:text="${proyecto.estado}"></td>
          <td>
            <a th:href="@{|/proyectos/${proyecto.id}|}" class="btn btn-info btn-sm">Ver Tareas</a>
            <a th:href="@{|/proyectos/eliminar/${proyecto.id}|}" class="btn btn-danger btn-sm">Eliminar</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
