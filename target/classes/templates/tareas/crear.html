<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Crear Tarea</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">

</head>
<body>
  <div class="container mt-5">
    <h2>Crear Nueva Tarea</h2>
    <form th:action="@{/tareas}" method="post" th:object="${tarea}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	  <div class="mb-3" th:if="${tarea.proyecto != null}">
	      <label class="form-label">Proyecto</label>
	      <input type="hidden" th:field="*{proyecto.id}" />
	      <p class="form-control-plaintext" th:text="${tarea.proyecto.nombre}"></p>
	    </div>
      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" th:field="*{titulo}" required>
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" th:field="*{descripcion}"></textarea>
      </div>
      <div class="mb-3">
        <label for="fechaLimite" class="form-label">Fecha Límite</label>
        <input type="date" class="form-control" id="fechaLimite" th:field="*{fechaLimite}">
      </div>
      <div class="mb-3">
        <label for="estado" class="form-label">Estado</label>
        <select class="form-select" id="estado" th:field="*{estado}">
          <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
        </select>
      </div>
      
      <button type="submit" class="btn btn-primary mb-3">Guardar Tarea</button>
    </form>
    <a class="btn btn-secondary mt-3" th:href="@{/proyectos}">Volver a Proyectos</a>
  </div>
</body>
</html>
