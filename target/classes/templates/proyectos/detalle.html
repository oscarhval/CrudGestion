<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Proyecto</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1 th:text="'Proyecto: ' + ${proyecto.nombre}"></h1>
    <p><strong>Descripción:</strong> <span th:text="${proyecto.descripcion}"></span></p>
    <p><strong>Fecha de Inicio:</strong> <span th:text="${proyecto.fechaInicio}"></span></p>
    <p><strong>Estado:</strong> <span th:text="${proyecto.estado}"></span></p>
    
    <h2>Tareas Asociadas</h2>
    <a class="btn btn-primary mb-3" th:href="@{/tareas/crear(proyectoId=${proyecto.id})}">Agregar Tarea</a>

    <div th:if="${#lists.isEmpty(proyecto.tareas)}" class="alert alert-info">
      No hay tareas asociadas.
    </div>

    <table class="table table-dark table-striped custom-table" th:if="${!#lists.isEmpty(proyecto.tareas)}">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Descripción</th>
          <th>Fecha Límite</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="tarea : ${proyecto.tareas}">
          <td th:text="${tarea.id}"></td>
          <td th:text="${tarea.titulo}"></td>
          <td th:text="${tarea.descripcion}"></td>
          <td th:text="${tarea.fechaLimite}"></td>
          <td th:text="${tarea.estado}"></td>
          <td>
            <a th:href="@{|/tareas/eliminar/${tarea.id}|}" class="btn btn-danger btn-sm">Eliminar</a>
          </td>
        </tr>
      </tbody>
    </table>

    <a class="btn btn-secondary" th:href="@{/proyectos}">Volver a Proyectos</a>
  </div>
</body>
</html>
